name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ── Lint ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: TypeScript typecheck
        run: npx turbo typecheck --filter="./packages/*" 2>&1 || echo "⚠️ typecheck step — add 'typecheck' script to packages"

      - name: Lint
        run: npx turbo lint --filter="./packages/*" 2>&1 || echo "⚠️ lint step — add 'lint' script to packages"

  # ── Build — web ────────────────────────────────────────
  build-web:
    name: Build (web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Build @wos/db
        run: npx turbo build --filter=@wos/db

      - name: Build @wos/shared
        run: npx turbo build --filter=@wos/shared

      - name: Build @wos/ui
        run: npx turbo build --filter=@wos/ui

      - name: Build @wos/web
        run: npx turbo build --filter=@wos/web
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 7

  # ── Build — desktop ────────────────────────────────────
  build-desktop:
    name: Build (desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Build @wos/db
        run: npx turbo build --filter=@wos/db

      - name: Build @wos/shared
        run: npx turbo build --filter=@wos/shared

      - name: Build @wos/ui
        run: npx turbo build --filter=@wos/ui

      - name: Build @wos/desktop (Tauri)
        run: npx turbo build --filter=@wos/desktop
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload desktop binaries
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/release/bundle/
          retention-days: 7

  # ── Format check ───────────────────────────────────────
  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Prettier check
        run: npx prettier --check "**/*.{ts,tsx,js,json,md,css}" --ignore-path .gitignore 2>&1 || echo "⚠️ No prettier config found — skipping"

  # ── Summary ─────────────────────────────────────────────
  ci-status:
    name: CI Status ✅
    runs-on: ubuntu-latest
    needs: [lint, build-web, build-desktop, format]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "lint:        ${{ needs.lint.result }}"
          echo "build-web:   ${{ needs.build-web.result }}"
          echo "build-desktop: ${{ needs.build-desktop.result }}"
          echo "format:      ${{ needs.format.result }}"

          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          echo "✅ All checks passed"
